name: Release to ECR

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ecr-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify release version and ancestry
        shell: bash
        run: |
          node scripts/release.mjs verify "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD refs/remotes/origin/master

  verify:
    needs: validate
    uses: ./.github/workflows/container.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate registry configuration
        shell: bash
        run: |
          : "${AWS_REGION:?Configure AWS_REGION}"
          : "${API_ECR_REPOSITORY:?Configure API_ECR_REPOSITORY}"
          : "${AWS_ROLE_ARN:?Configure AWS_ROLE_ARN}"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish and verify image
        id: image
        shell: bash
        run: |
          version="$(node scripts/release.mjs check "$GITHUB_REF_NAME")"
          minor="${version%.*}"
          revision="$(git rev-parse HEAD)"
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${API_ECR_REPOSITORY}"

          aws ecr describe-repositories --repository-names "$API_ECR_REPOSITORY" >/dev/null
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"

          digest_for_tag() {
            aws ecr describe-images --repository-name "$API_ECR_REPOSITORY" \
              --image-ids "imageTag=$1" --query 'imageDetails[0].imageDigest' --output text
          }

          error_file="$RUNNER_TEMP/ecr-error.txt"
          if digest="$(digest_for_tag "$version" 2>"$error_file")"; then
            echo "Version tag already exists. Verifying its source before reusing it."
          elif grep -q ImageNotFoundException "$error_file"; then
            docker buildx build --platform linux/amd64,linux/arm64 \
              --label "org.opencontainers.image.version=$version" \
              --label "org.opencontainers.image.revision=$revision" \
              --annotation "index:org.opencontainers.image.version=$version" \
              --annotation "index:org.opencontainers.image.revision=$revision" \
              --tag "${image}:${version}" --push core
            digest="$(digest_for_tag "$version")"
          else
            cat "$error_file" >&2
            exit 1
          fi

          docker buildx imagetools inspect --raw "${image}@${digest}" |
            jq -e --arg revision "$revision" --arg version "$version" '
              .annotations["org.opencontainers.image.revision"] == $revision and
              .annotations["org.opencontainers.image.version"] == $version and
              ([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]
            '
          # A retry of an older release must not move an alias backwards.
          update_alias() {
            local alias="$1" current_digest current_version newest
            if current_digest="$(digest_for_tag "$alias" 2>"$error_file")"; then
              if [[ "$current_digest" == "$digest" ]]; then
                return
              fi
              current_version="$(docker buildx imagetools inspect --raw "${image}@${current_digest}" |
                jq -r '.annotations["org.opencontainers.image.version"] // empty')"
              if [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                newest="$(printf '%s\n' "$version" "$current_version" | sort -V | tail -1)"
                if [[ "$newest" != "$version" ]]; then
                  echo "Keeping $alias on newer release $current_version."
                  return
                fi
              fi
            elif ! grep -q ImageNotFoundException "$error_file"; then
              cat "$error_file" >&2
              return 1
            fi
            docker buildx imagetools create --tag "${image}:${alias}" "${image}@${digest}"
            test "$digest" = "$(digest_for_tag "$alias")"
          }

          update_alias "$minor"
          update_alias latest
          printf 'version=%s\nimage=%s\ndigest=%s\n' "$version" "$image" "$digest" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          manifest="$RUNNER_TEMP/release-manifest.json"
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > "$notes"
          printf '\n## Container image\n\n- Image: `%s:%s`\n- Digest: `%s`\n- Platforms: linux/amd64, linux/arm64\n' \
            "$IMAGE" "$VERSION" "$DIGEST" >> "$notes"
          jq -n --arg version "$VERSION" --arg image "${IMAGE}:${VERSION}" --arg digest "$DIGEST" \
            '{version: $version, image: $image, digest: $digest, platforms: ["linux/amd64", "linux/arm64"]}' > "$manifest"
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == true ]]; then
              gh release upload "$GITHUB_REF_NAME" "$manifest" --clobber
              gh release edit "$GITHUB_REF_NAME" --draft=false
            else
              gh release download "$GITHUB_REF_NAME" --pattern release-manifest.json --output - |
                jq -e --arg digest "$DIGEST" '.digest == $digest'
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$manifest" --verify-tag \
              --title "My Bookshelf $VERSION" --notes-file "$notes"
          fi
          printf 'Published `%s@%s`.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
