name: Container CI and release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  build:
    if: github.event_name != 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both platforms
        run: docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly core

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: ecr-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: my-bookshelf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      - name: Publish and verify multi-platform image
        shell: bash
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${ECR_REPOSITORY}"
          version_tag="sha-${GITHUB_SHA}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "${image}:${version_tag}" --tag "${image}:latest" --push core

          digest_for_tag() {
            aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$1" --query 'imageDetails[0].imageDigest' --output text
          }
          digest="$(digest_for_tag "$version_tag")"
          test "$digest" = "$(digest_for_tag latest)"
          docker buildx imagetools inspect --raw "${image}@${digest}" |
            jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]'
          printf 'Published `%s@%s` with tags `%s` and `latest`.\n' \
            "$image" "$digest" "$version_tag" >> "$GITHUB_STEP_SUMMARY"
